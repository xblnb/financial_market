name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build full jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: financialmarket-full
          path: build/libs/financialmarket-1.0.0-full.jar
          if-no-files-found: error
